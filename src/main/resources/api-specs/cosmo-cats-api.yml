openapi: 3.0.3
info:
  title: Cosmo Cats Intergalactic Marketplace API
  description: >
    API contract for the Cosmo Cats marketplace (anti-gravity yarn balls, cosmic milk and more).
    All endpoints are versioned in the path (/api/v1). Errors follow RFC 9457 (application/problem+json).
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Products
    description: CRUD operations over products
  - name: Delivery
    description: Delivery estimates from a 3rd-party service

paths:
  /api/v1/products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: Get a page of products
      description: >
        Returns a paged envelope. Page index is zero-based. Products are ordered by creation time,
        then by name, then by id, so pages never overlap.
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page index
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Page size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: A page of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProducts'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Products]
      operationId: createProduct
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created
          headers:
            Location:
              description: URL of the created product
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Product identifier
        schema:
          type: string
          format: uuid
    get:
      tags: [Products]
      operationId: getProductById
      summary: Get a product by id
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Products]
      operationId: updateProduct
      summary: Replace a product (full update)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Products]
      operationId: deleteProduct
      summary: Delete a product
      responses:
        '204':
          description: Product deleted
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/delivery-estimates:
    get:
      tags: [Delivery]
      operationId: getDeliveryEstimate
      summary: Estimate delivery to a destination
      description: >
        Calls a 3rd-party delivery service. The estimate depends only on the destination.
        If the service answers with an error or is unreachable, 502 is returned; if it does not answer
        in time, 504 is returned.
      parameters:
        - name: destination
          in: query
          required: true
          description: Destination planet or station
          schema:
            type: string
            minLength: 1
            maxLength: 50
            example: Mars
      responses:
        '200':
          description: Delivery estimate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryEstimate'
        '400':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  schemas:
    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [name, price, currency, stock, categoryId]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          pattern: '(?i)(^|[^A-Za-z0-9])(star|galaxy|comet|cosmic|nebula|orbit|planet|moon|space|gravity|asteroid|meteor|nova|void)([^A-Za-z0-9]|$)'
          description: >
            Must contain a cosmic term (star, galaxy, comet, ...) as a whole word, not as a part of another word.
            Unique among products, ignoring letter case. Leading and trailing spaces are removed.
          example: Star-Dust Anti-Gravity Yarn Ball
        description:
          type: string
          maxLength: 1000
          example: A ball of yarn that floats. Cats approve.
        price:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        stock:
          type: integer
          minimum: 0
          maximum: 100000
          example: 120
        categoryId:
          type: string
          format: uuid
          description: Id of an existing category
          example: 11111111-1111-1111-1111-111111111111
        sellerEmail:
          type: string
          format: email
          example: yarn@cosmo-cats.market
    UpdateProductRequest:
      type: object
      additionalProperties: false
      required: [name, price, currency, stock, categoryId]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          pattern: '(?i)(^|[^A-Za-z0-9])(star|galaxy|comet|cosmic|nebula|orbit|planet|moon|space|gravity|asteroid|meteor|nova|void)([^A-Za-z0-9]|$)'
          description: >
            Must contain a cosmic term (star, galaxy, comet, ...) as a whole word, not as a part of another word.
            Unique among products, ignoring letter case (the product may keep its own name).
            Leading and trailing spaces are removed.
          example: Star-Dust Anti-Gravity Yarn Ball
        description:
          type: string
          maxLength: 1000
          example: A ball of yarn that floats. Cats approve.
        price:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        stock:
          type: integer
          minimum: 0
          maximum: 100000
          example: 120
        categoryId:
          type: string
          format: uuid
          description: Id of an existing category
          example: 11111111-1111-1111-1111-111111111111
        sellerEmail:
          type: string
          format: email
          example: yarn@cosmo-cats.market
    Amount:
      type: number
      format: decimal
      exclusiveMinimum: true
      minimum: 0
      maximum: 1000000
      multipleOf: 0.01
      description: Amount in the given currency, strictly greater than 0, at most 1000000.00, at most 2 decimal places
      example: 19.99
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      description: 3-letter uppercase currency code (GCR - Galactic Credit)
      example: GCR
    ProductResponse:
      type: object
      required: [id, name, price, currency, stock, categoryId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          format: decimal
          example: 19.99
        currency:
          type: string
          example: GCR
        stock:
          type: integer
        categoryId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    PagedProducts:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        page:
          type: integer
          description: Zero-based page index
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    DeliveryEstimate:
      type: object
      required: [destination, etaDays, cost, currency]
      properties:
        destination:
          type: string
          example: Mars
        etaDays:
          type: integer
          example: 7
        cost:
          type: number
          format: decimal
          example: 42.50
        currency:
          type: string
          example: GCR
    FieldViolation:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: Name of the body field (full path, e.g. price) or of the query/path parameter
          example: price
        code:
          type: string
          description: >
            Stable machine-readable code, safe to switch on and to translate. Either the name of the violated
            constraint (NotNull, NotBlank, Size, Min, Max, DecimalMin, DecimalMax, Digits, Pattern, Email,
            CosmicWordCheck), or one of: TypeMismatch (wrong type of a value), UnknownField (field that is not
            part of the contract), Required (missing query parameter), CategoryNotFound (categoryId points to
            nothing). One field is reported at most once.
          example: DecimalMin
        message:
          type: string
          description: Human-readable text; may change, do not parse it
          example: must be greater than 0
    ProblemDetail:
      type: object
      description: RFC 9457 problem details
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
          example: https://cosmo-cats.market/errors/validation
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "Field 'price' must be greater than 0."
        instance:
          type: string
          example: /api/v1/products
        errors:
          type: array
          description: Present only for validation errors
          items:
            $ref: '#/components/schemas/FieldViolation'

  responses:
    ValidationError:
      description: >
        Invalid request: validation failed, a value has the wrong type, the body has an unknown field or is not
        valid JSON, a parameter is missing or bad, or the referenced category does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: A product with the same name (ignoring letter case) already exists
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InternalError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    BadGateway:
      description: The 3rd-party service answered with an error or is unreachable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    GatewayTimeout:
      description: The 3rd-party service did not answer in time
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
