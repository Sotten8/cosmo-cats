openapi: 3.0.3
info:
  title: Cosmo Cats Intergalactic Marketplace API
  description: >
    API contract for the Cosmo Cats marketplace (anti-gravity yarn balls, cosmic milk and more).
    Errors follow RFC 9457 (application/problem+json).
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Products
    description: CRUD operations over products

paths:
  /api/products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: Get a page of products
      description: Returns a paged envelope. Page index is zero-based.
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page index
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Page size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: A page of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProducts'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Products]
      operationId: createProduct
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Product created
          headers:
            Location:
              description: URL of the created product
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Product identifier
        schema:
          type: string
          format: uuid
    get:
      tags: [Products]
      operationId: getProductById
      summary: Get a product by id
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Products]
      operationId: updateProduct
      summary: Replace a product (full update)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Products]
      operationId: deleteProduct
      summary: Delete a product
      responses:
        '204':
          description: Product deleted
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/products/{id}/delivery-estimate:
    get:
      tags: [Products]
      operationId: getDeliveryEstimate
      summary: Estimate delivery of a product to a destination
      description: Calls a 3rd-party delivery service. If it fails or times out, 502 is returned.
      parameters:
        - name: id
          in: path
          required: true
          description: Product identifier
          schema:
            type: string
            format: uuid
        - name: destination
          in: query
          required: true
          description: Destination planet or station
          schema:
            type: string
            minLength: 1
            maxLength: 50
            example: Mars
      responses:
        '200':
          description: Delivery estimate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryEstimate'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  schemas:
    ProductRequest:
      type: object
      required: [name, price, stock, categoryId]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          pattern: '(?i).*(star|galaxy|comet|cosmic|nebula|orbit|planet|moon|space|gravity|asteroid|meteor|nova|void).*'
          description: Must contain a cosmic term (star, galaxy, comet, ...)
          example: Star-Dust Anti-Gravity Yarn Ball
        description:
          type: string
          maxLength: 1000
          example: A ball of yarn that floats. Cats approve.
        price:
          type: number
          format: decimal
          exclusiveMinimum: true
          minimum: 0
          multipleOf: 0.01
          description: Price in credits, strictly greater than 0, at most 2 decimal places
          example: 19.99
        stock:
          type: integer
          minimum: 0
          example: 120
        categoryId:
          type: integer
          format: int64
          minimum: 0
          example: 1
        sellerEmail:
          type: string
          format: email
          example: yarn@cosmo-cats.market
    ProductResponse:
      type: object
      required: [id, name, price, stock, categoryId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          format: decimal
        stock:
          type: integer
        categoryId:
          type: integer
          format: int64
        sellerEmail:
          type: string
          format: email
          nullable: true
        createdAt:
          type: string
          format: date-time
    PagedProducts:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        page:
          type: integer
          description: Zero-based page index
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    DeliveryEstimate:
      type: object
      required: [productId, destination, etaDays, cost, currency]
      properties:
        productId:
          type: string
          format: uuid
        destination:
          type: string
          example: Mars
        etaDays:
          type: integer
          example: 7
        cost:
          type: number
          format: decimal
          example: 42.50
        currency:
          type: string
          example: GCR
    FieldViolation:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: price
        message:
          type: string
          example: must be greater than 0
    ProblemDetail:
      type: object
      description: RFC 9457 problem details
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
          example: https://cosmo-cats.market/errors/validation
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "Field 'price' must be greater than 0."
        instance:
          type: string
          example: /api/products
        errors:
          type: array
          description: Present only for validation errors
          items:
            $ref: '#/components/schemas/FieldViolation'

  responses:
    ValidationError:
      description: Invalid request (validation failed, malformed JSON or bad parameter)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InternalError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    BadGateway:
      description: The 3rd-party service failed, timed out or is unreachable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
