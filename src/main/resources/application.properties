spring.application.name=cosmo-cats
spring.web.locale=en
spring.web.locale-resolver=fixed
spring.jackson.deserialization.fail-on-unknown-properties=true
server.port=8080

cosmo.delivery.base-url=http://localhost:8089
cosmo.delivery.connect-timeout=2s
cosmo.delivery.read-timeout=3s

spring.datasource.url=jdbc:postgresql://localhost:5432/cosmocats
spring.datasource.username=cosmo
spring.datasource.password=cosmo
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
