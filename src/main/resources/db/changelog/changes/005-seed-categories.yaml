databaseChangeLog:
  - changeSet:
      id: 005-seed-categories
      author: stanislav
      comment: Fixed public ids keep the Lab 1 demo data (README, requests.http) valid.
      changes:
        - sql:
            sql: >
              INSERT INTO category (id, public_id, name) VALUES
              (nextval('category_id_seq'), '11111111-1111-1111-1111-111111111111', 'Toys'),
              (nextval('category_id_seq'), '22222222-2222-2222-2222-222222222222', 'Food and drinks'),
              (nextval('category_id_seq'), '33333333-3333-3333-3333-333333333333', 'Treats');
      rollback:
        - sql:
            sql: >
              DELETE FROM category WHERE public_id IN (
              '11111111-1111-1111-1111-111111111111',
              '22222222-2222-2222-2222-222222222222',
              '33333333-3333-3333-3333-333333333333');
